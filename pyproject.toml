[project]
name = "daily-briefing"
version = "0.1.0"
description = "A private daily briefing: your calendar, the emails that need you, and the news that matters. Email never leaves your computer."
readme = "README.md"
license = "MIT"
authors = [{ name = "Abhishek Rajput" }]
requires-python = ">=3.11"
keywords = ["briefing", "email", "gmail", "imap", "local-llm", "ollama", "news", "productivity", "telegram"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Communications :: Email",
    "Topic :: Office/Business :: Scheduling",
]
dependencies = [
    "litellm>=1.50",
    "httpx>=0.27",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
briefing = "briefing.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["briefing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
